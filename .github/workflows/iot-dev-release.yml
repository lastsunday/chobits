name: iot-dev-release
run-name: ${{ github.actor }} iot dev build

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]

concurrency:
  group: iot-dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      dev-version: ${{ steps.gen.outputs.DEV_VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        with:
          base: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          filters: |
            iot:
              - 'apps/iot/**'

      - id: gen
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.filter.outputs.iot == 'true'
        run: |
          dev_version=$(bash scripts/version.sh apps/iot/Cargo.toml)
          echo "DEV_VERSION=$dev_version" >> "$GITHUB_ENV"
          echo "DEV_VERSION=$dev_version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.dev-version != ''
    uses: ./.github/workflows/reusable-iot-build.yml
    with:
      version: ${{ needs.prepare.outputs.dev-version }}
      prerelease: true
      tag-name: dev-iot-${{ github.run_number }}
      boards: '["esp32c6-devkitc-1"]'
      target: "riscv32imac-unknown-none-elf"
    secrets: inherit

  cleanup:
    needs: [prepare, build]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/reusable-dev-release-cleanup.yml
    with:
      tag-prefix: dev-iot-
    secrets: inherit