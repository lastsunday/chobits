name: iot-release
run-name: ${{ github.actor }} iot release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Skip GitHub release
        type: boolean
        default: false
      platforms:
        description: >-
          JSON array of platform specs. Each: {"chip","target",
          "use-xtensa-toolchain","boards":[...]}. Empty = all boards
          (esp32c6-devkitc-1 + lckfb-szpi-esp32s3).
        type: string
  push:
    tags:
      - "vanling-iot@*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
    steps:
      - name: Set VERSION
        id: set-version
        run: echo "VERSION=${GITHUB_REF_NAME#vanling-iot@}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/reusable-iot-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      dry-run: ${{ inputs.dry-run || false }}
      platforms: ${{ inputs.platforms }}
    secrets: inherit