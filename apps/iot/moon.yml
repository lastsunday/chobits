language: 'rust'
tags: ['iot']

tasks:
  bump:
    script: |
      bash ../../scripts/bump.sh \
        "vanling-iot" \
        "Cargo.toml" \
        "apps/iot/**"
    options:
      runInCI: false

  format:
    command: 'cargo fmt --check'

  check:
    command: 'cargo check -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    deps:
      - ~:format

  build:
    command: 'cargo build --release -p iot-app --bin vanling --target $CARGO_ESP_TARGET'
    outputs:
      - 'target/$CARGO_ESP_TARGET/release/vanling'
    deps:
      - ~:check

  test:
    command: 'cargo test -p iot-core'
    deps:
      - ~:check

  lint:
    command: 'cargo clippy -p iot-app --bin vanling --target $CARGO_ESP_TARGET -- -D warnings'
    deps:
      - ~:check

  lint-host:
    command: 'cargo clippy -p iot-core --all-targets -- -D warnings'
    deps:
      - ~:check

  flash:
    command: 'cargo run -p iot-app --release --target $CARGO_ESP_TARGET'
    deps:
      - ~:build
    options:
      persistent: true
      cache: false
      runInCI: false