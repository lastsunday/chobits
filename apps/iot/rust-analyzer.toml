# rust-analyzer analyzes one feature set at a time; code behind an
# inactive feature is dimmed and loses completion/navigation by design.
# This file pins which set is active. It is hot-reloaded on save by
# rust-analyzer itself (no :CargoReload needed). Switch by uncommenting
# one preset and commenting out the others. Default = C6 firmware.

# ---- C6 firmware (daily default; targets the rust-toolchain riscv) ----
[cargo]
features = ["esp32c6-devkitc-1", "console-auto"]
target = "riscv32imac-unknown-none-elf"

# ---- S3 firmware (--no-default-features; no target: xtensa std is
#      provided by the espup "esp" toolchain, not rustup targets) ----
# [cargo]
# features = ["lckfb-szpi-esp32s3", "console-auto"]
# noDefaultFeatures = true

# ---- host smoke binary (host arch; mutually exclusive with esp features) ----
# [cargo]
# features = ["host"]
# noDefaultFeatures = true